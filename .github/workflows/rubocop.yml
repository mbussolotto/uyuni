name: RuboCop

on:
  pull_request:
    paths:
      - '.github/workflows/rubocop.yml'
      - 'testsuite/features/**.rb'
      - 'testsuite/ext-tools/**.rb'
      - 'testsuite/.rubocop.yml'
      - 'testsuite/.rubocop_todo.yml'
      - 'testsuite/Gemfile'
      - 'testsuite/Rakefile'

permissions:
  contents: read

jobs:
  rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
    - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 #v1.338.0
      with:
        ruby-version: '3.3'

    - name: Install and Run RuboCop
      run: |
        cd testsuite
        gem install bundler
        bundle install
        bundle exec rubocop --version
        bundle exec rubocop features Rakefile ext-tools
